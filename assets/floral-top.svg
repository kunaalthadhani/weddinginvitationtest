<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 180" preserveAspectRatio="xMidYMin slice">
  <defs>
    <radialGradient id="peony" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#fff0e8"/>
      <stop offset="55%" stop-color="#f1c7be"/>
      <stop offset="100%" stop-color="#c97f7f"/>
    </radialGradient>
    <radialGradient id="peony2" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#ffeae0"/>
      <stop offset="60%" stop-color="#e8b5ab"/>
      <stop offset="100%" stop-color="#a85f5a"/>
    </radialGradient>
    <radialGradient id="bud" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#f9d8cf"/>
      <stop offset="100%" stop-color="#c97f7f"/>
    </radialGradient>
    <linearGradient id="leaf" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#9bab8f"/>
      <stop offset="100%" stop-color="#6f8068"/>
    </linearGradient>
    <linearGradient id="leaf2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#b6c0a9"/>
      <stop offset="100%" stop-color="#8a9c7e"/>
    </linearGradient>
    <radialGradient id="pearl" cx="35%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e8d6c8"/>
    </radialGradient>

    <!-- Reusable peony shape -->
    <g id="peony-shape">
      <circle r="22" fill="url(#peony)"/>
      <g fill="#d9a097" opacity="0.35">
        <ellipse cx="-10" cy="-8" rx="11" ry="8" transform="rotate(-25)"/>
        <ellipse cx="10"  cy="-8" rx="11" ry="8" transform="rotate(25)"/>
        <ellipse cx="0"   cy="10" rx="12" ry="8"/>
      </g>
      <circle r="6" fill="#a85f5a" opacity="0.4"/>
      <circle r="3" fill="#7a3838" opacity="0.5"/>
    </g>

    <g id="leaf-shape">
      <path d="M0 0 Q 12 -6 24 0 Q 12 6 0 0 Z" fill="url(#leaf)"/>
      <path d="M0 0 L 24 0" stroke="#5a6c52" stroke-width="0.6" opacity="0.6"/>
    </g>
  </defs>

  <!-- Greenery sweep (left to right) -->
  <g opacity="0.85">
    <path d="M -10 30 Q 100 -10 220 40 Q 340 90 460 30" fill="none" stroke="#8a9c7e" stroke-width="1.5" opacity="0.5"/>

    <!-- leaves along the curve -->
    <use href="#leaf-shape" transform="translate(40 32)  rotate(-20) scale(0.9)"/>
    <use href="#leaf-shape" transform="translate(80 24)  rotate(-10) scale(1.1)"/>
    <use href="#leaf-shape" transform="translate(140 30) rotate(10)  scale(1.2)"/>
    <use href="#leaf-shape" transform="translate(200 48) rotate(20)  scale(1.0)"/>
    <use href="#leaf-shape" transform="translate(260 62) rotate(25)  scale(1.1)"/>
    <use href="#leaf-shape" transform="translate(320 60) rotate(15)  scale(1.2)"/>
    <use href="#leaf-shape" transform="translate(380 42) rotate(-10) scale(1.0)"/>
    <use href="#leaf-shape" transform="translate(420 26) rotate(-25) scale(0.9)"/>
  </g>

  <!-- Pink peonies clustered top corners -->
  <g>
    <use href="#peony-shape" transform="translate(-10 -10) scale(1.4)"/>
    <use href="#peony-shape" transform="translate(40 30) scale(0.9)"/>
    <use href="#peony-shape" transform="translate(75 -5) scale(1.1)"/>

    <use href="#peony-shape" transform="translate(440 -10) scale(1.5)"/>
    <use href="#peony-shape" transform="translate(395 25) scale(1.0)"/>
    <use href="#peony-shape" transform="translate(360 -5) scale(0.85)"/>
  </g>

  <!-- Small buds & pearls scattered -->
  <g opacity="0.9">
    <circle cx="120" cy="20" r="6" fill="url(#bud)"/>
    <circle cx="160" cy="50" r="4" fill="url(#bud)"/>
    <circle cx="250" cy="20" r="5" fill="url(#bud)"/>
    <circle cx="300" cy="35" r="6" fill="url(#bud)"/>

    <circle cx="105" cy="55" r="4" fill="url(#pearl)" stroke="#b89a85" stroke-width="0.3"/>
    <circle cx="190" cy="18" r="3.5" fill="url(#pearl)" stroke="#b89a85" stroke-width="0.3"/>
    <circle cx="285" cy="60" r="4" fill="url(#pearl)" stroke="#b89a85" stroke-width="0.3"/>
    <circle cx="350" cy="50" r="3.5" fill="url(#pearl)" stroke="#b89a85" stroke-width="0.3"/>
  </g>

  <!-- Soft watercolor wash overlay -->
  <ellipse cx="220" cy="0" rx="280" ry="60" fill="#f5d6cc" opacity="0.25"/>
</svg>
